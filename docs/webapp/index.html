<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HataBot Settings</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --text: #171717;
      --muted: #666c75;
      --line: #d9dde3;
      --accent: #0f6fff;
      --danger: #cb3d3d;
      --chip: #f0f3f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 16px 24px;
    }

    .header {
      margin-bottom: 16px;
    }

    .title {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      font: inherit;
      color: var(--text);
      background: var(--surface);
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--chip);
      cursor: pointer;
      user-select: none;
      min-height: 48px;
    }

    .chip input {
      margin: 0;
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .chip span {
      line-height: 1.3;
      font-size: 14px;
    }

    .room-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .room-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--chip);
      cursor: pointer;
      font-weight: 600;
    }

    .room-option input {
      display: none;
    }

    .room-option.active {
      border-color: var(--accent);
      background: rgba(15, 111, 255, 0.08);
      color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      flex: 1;
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .note {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .error {
      display: none;
      margin-bottom: 14px;
      padding: 12px 13px;
      border-radius: 12px;
      background: rgba(203, 61, 61, 0.08);
      color: var(--danger);
      font-size: 14px;
      line-height: 1.4;
    }

    @media (max-width: 640px) {
      .field-grid,
      .chips,
      .room-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1 class="title">Настройки поиска</h1>
      <p class="subtitle">Измени параметры и нажми «Сохранить». После сохранения бот применит их сразу.</p>
    </div>

    <div id="error" class="error"></div>

    <div class="card">
      <h2 class="section-title">Основное</h2>
      <div class="field-grid">
        <div class="field full">
          <label for="city">Город</label>
          <input id="city" type="text" readonly>
        </div>
        <div class="field">
          <label for="minPrice">Цена от</label>
          <input id="minPrice" type="number" min="0" step="1000" inputmode="numeric">
        </div>
        <div class="field">
          <label for="maxPrice">Цена до</label>
          <input id="maxPrice" type="number" min="0" step="1000" inputmode="numeric">
        </div>
        <div class="field full">
          <label for="minArea">Площадь от</label>
          <input id="minArea" type="number" min="0" step="1" inputmode="decimal">
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title">Комнаты</h2>
      <div id="rooms" class="room-options"></div>
    </div>

    <div class="card">
      <h2 class="section-title">Районы</h2>
      <div id="districts" class="chips"></div>
    </div>

    <div class="card">
      <h2 class="section-title">Источники</h2>
      <div id="sources" class="chips"></div>
      <div class="note">Отключённые источники временно не участвуют в мониторинге и подборе вариантов.</div>
    </div>

    <div class="actions">
      <button id="saveButton" class="primary" type="button">Сохранить</button>
      <button id="cancelButton" class="secondary" type="button">Закрыть</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    const params = new URLSearchParams(window.location.search);

    function parseJsonParam(name, fallback) {
      const raw = params.get(name);
      if (!raw) return fallback;
      try {
        return JSON.parse(raw);
      } catch {
        return fallback;
      }
    }

    function parseNumberParam(name) {
      const raw = params.get(name);
      if (!raw) return "";
      const value = Number(raw);
      return Number.isFinite(value) ? String(value) : "";
    }

    const model = {
      city: params.get("city") || "Новосибирск",
      districts: new Set(parseJsonParam("districts", [])),
      supportedDistricts: parseJsonParam("supported_districts", []),
      enabledSourceKeys: new Set(parseJsonParam("enabled_source_keys", [])),
      sources: parseJsonParam("sources", []),
      minPrice: parseNumberParam("min_price_rub"),
      maxPrice: parseNumberParam("max_price_rub"),
      minArea: parseNumberParam("min_area_m2"),
      minRooms: params.get("min_rooms") || "3"
    };

    const cityInput = document.getElementById("city");
    const minPriceInput = document.getElementById("minPrice");
    const maxPriceInput = document.getElementById("maxPrice");
    const minAreaInput = document.getElementById("minArea");
    const districtsRoot = document.getElementById("districts");
    const sourcesRoot = document.getElementById("sources");
    const roomsRoot = document.getElementById("rooms");
    const errorBox = document.getElementById("error");

    function applyTheme() {
      if (!tg) return;
      const theme = tg.themeParams || {};
      const root = document.documentElement;
      if (theme.bg_color) root.style.setProperty("--bg", theme.secondary_bg_color || theme.bg_color);
      if (theme.secondary_bg_color) root.style.setProperty("--chip", theme.secondary_bg_color);
      if (theme.text_color) root.style.setProperty("--text", theme.text_color);
      if (theme.hint_color) root.style.setProperty("--muted", theme.hint_color);
      if (theme.button_color) root.style.setProperty("--accent", theme.button_color);
      if (theme.button_text_color) root.style.setProperty("--button-text", theme.button_text_color);
      if (theme.section_bg_color) root.style.setProperty("--surface", theme.section_bg_color);
    }

    function renderCheckboxGroup(root, items, selectedSet, formatter) {
      root.innerHTML = "";
      items.forEach((item) => {
        const label = document.createElement("label");
        label.className = "chip";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = selectedSet.has(formatter.value(item));
        checkbox.addEventListener("change", () => {
          const value = formatter.value(item);
          if (checkbox.checked) {
            selectedSet.add(value);
          } else {
            selectedSet.delete(value);
          }
        });

        const text = document.createElement("span");
        text.textContent = formatter.label(item);

        label.appendChild(checkbox);
        label.appendChild(text);
        root.appendChild(label);
      });
    }

    function renderRooms() {
      const options = ["3", "4", "5"];
      roomsRoot.innerHTML = "";

      options.forEach((value) => {
        const label = document.createElement("label");
        label.className = "room-option" + (model.minRooms === value ? " active" : "");

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "minRooms";
        radio.value = value;
        radio.checked = model.minRooms === value;
        radio.addEventListener("change", () => {
          model.minRooms = value;
          renderRooms();
        });

        const text = document.createElement("span");
        text.textContent = value + "+";

        label.appendChild(radio);
        label.appendChild(text);
        roomsRoot.appendChild(label);
      });
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    function collectPayload() {
      const minPrice = minPriceInput.value.trim();
      const maxPrice = maxPriceInput.value.trim();
      const minArea = minAreaInput.value.trim();

      if (model.districts.size === 0) {
        throw new Error("Выбери хотя бы один район.");
      }
      if (model.enabledSourceKeys.size === 0) {
        throw new Error("Оставь хотя бы один источник.");
      }
      if (minPrice && maxPrice && Number(minPrice) > Number(maxPrice)) {
        throw new Error("Цена от не может быть больше цены до.");
      }

      return {
        type: "settings_form_submit",
        payload: {
          districts: Array.from(model.districts),
          min_price_rub: minPrice || null,
          max_price_rub: maxPrice || null,
          min_area_m2: minArea || null,
          min_rooms: model.minRooms,
          enabled_source_keys: Array.from(model.enabledSourceKeys)
        }
      };
    }

    function submit() {
      clearError();
      try {
        const payload = collectPayload();
        if (tg) {
          tg.sendData(JSON.stringify(payload));
          tg.close();
          return;
        }
        showError("Эту форму нужно открывать из Telegram, чтобы сохранить изменения.");
      } catch (error) {
        showError(error.message || "Не получилось сохранить изменения.");
      }
    }

    function init() {
      if (tg) {
        tg.ready();
        tg.expand();
      }

      applyTheme();

      cityInput.value = model.city;
      minPriceInput.value = model.minPrice;
      maxPriceInput.value = model.maxPrice;
      minAreaInput.value = model.minArea;

      renderRooms();
      renderCheckboxGroup(
        districtsRoot,
        model.supportedDistricts,
        model.districts,
        {
          value: (item) => item,
          label: (item) => item
        }
      );
      renderCheckboxGroup(
        sourcesRoot,
        model.sources,
        model.enabledSourceKeys,
        {
          value: (item) => item.key,
          label: (item) => item.name
        }
      );

      document.getElementById("saveButton").addEventListener("click", submit);
      document.getElementById("cancelButton").addEventListener("click", () => {
        if (tg) {
          tg.close();
        } else {
          window.close();
        }
      });
    }

    init();
  </script>
</body>
</html>
