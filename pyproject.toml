[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatabot"
version = "0.1.0"
description = "Local apartment listing monitor with Avito support and Telegram notifications."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
hatabot = "hata_bot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
